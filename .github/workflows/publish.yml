name: Publish MoonModCLI as Release Asset

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: MoonModCLI.lua
